name: Mason immutable observer image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.4.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run type-check
      - run: pnpm exec biome check src/server.ts src/server.test.ts src/observerTools.ts
      - run: pnpm run build

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v3.12.0
      - id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v5.10.0
        with:
          images: ghcr.io/masonjames/dokploy-mcp-observer
          tags: type=raw,value=${{ github.sha }}
      - name: Build candidate
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: local/dokploy-mcp-observer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Inventory critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/dokploy-mcp-observer:${{ github.sha }}
          format: table
          output: trivy-unresolved.txt
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '0'
      - name: Enforce fixed-critical gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/dokploy-mcp-observer:${{ github.sha }}
          format: table
          output: trivy-gate.txt
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - id: immutable
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=ghcr.io/masonjames/dokploy-mcp-observer@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/masonjames/dokploy-mcp-observer
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify provenance
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.immutable.outputs.image }}
        run: gh attestation verify "oci://${IMAGE}" --repo "$GITHUB_REPOSITORY" --format json > provenance.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dokploy-mcp-observer-${{ github.sha }}
          path: |
            provenance.json
            trivy-gate.txt
            trivy-unresolved.txt
          retention-days: 90
